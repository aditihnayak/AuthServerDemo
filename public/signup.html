<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Auth Server</title>
  <meta name="description" content="Create a new account">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="card">
    <h1>Create account</h1>
    <p class="subtitle">Sign up to get started</p>

    <div id="alert-container"></div>

    <form action="/api/signup" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Choose a password" required autocomplete="new-password" minlength="4">
      </div>

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p class="link-row">Already have an account? <a href="/login">Log in</a></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const alertContainer = document.getElementById('alert-container');

    if (params.get('error')) {
      alertContainer.innerHTML = '<div class="alert alert-error">' + escapeHtml(params.get('error')) + '</div>';
    }
    if (params.get('success')) {
      alertContainer.innerHTML = '<div class="alert alert-success">' + escapeHtml(params.get('success')) + '</div>';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
