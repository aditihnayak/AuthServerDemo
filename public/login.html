<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Auth Server</title>
  <meta name="description" content="Log in to your account">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <!-- Alerts (populated by query params) -->
    <div id="alert-container"></div>

    <form id="login-form" action="/api/login" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <div class="form-group" id="otp-group" style="display: none;">
        <label for="otp">One-Time Password</label>
        <input type="text" id="otp" name="otp" placeholder="6-digit OTP" autocomplete="one-time-code" inputmode="numeric" maxlength="6">
      </div>

      <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <p class="link-row">Don't have an account? <a href="/signup">Sign up</a></p>
  </div>

  <script>
    // Parse query parameters and show alerts
    const params = new URLSearchParams(window.location.search);

    const alertContainer = document.getElementById('alert-container');
    if (params.get('error')) {
      alertContainer.innerHTML = '<div class="alert alert-error">' + escapeHtml(params.get('error')) + '</div>';
    }
    if (params.get('success')) {
      alertContainer.innerHTML = '<div class="alert alert-success">' + escapeHtml(params.get('success')) + '</div>';
    }
    if (params.get('info')) {
      alertContainer.innerHTML = '<div class="alert alert-info">' + escapeHtml(params.get('info')) + '</div>';
    }

    // If OTP mode, show OTP field, pre-fill username, and display the OTP code
    if (params.get('otp') === 'true') {
      document.getElementById('otp-group').style.display = 'block';

      const usernameField = document.getElementById('username');
      if (params.get('username')) {
        usernameField.value = params.get('username');
      }

      // Show the OTP directly on the page (demo mode)
      const demoOtp = params.get('demoOtp');
      if (demoOtp) {
        const otpDisplay = document.createElement('div');
        otpDisplay.className = 'alert alert-info';
        otpDisplay.innerHTML = 'Your OTP code: <strong style="font-size:1.3em; letter-spacing:3px; margin-left:8px;">' + escapeHtml(demoOtp) + '</strong>';
        alertContainer.appendChild(otpDisplay);
      }

      document.getElementById('otp').focus();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
